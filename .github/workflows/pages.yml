name: Synthetic report preview

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Test recorded-output evaluation, HTML and packaging
        run: python -m unittest discover -v
      - name: Install and verify offline package and synthetic HTML
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-index .
          .venv/bin/python scripts/verify_demo.py --cli .venv/bin/tracebench
          .venv/bin/python scripts/verify_html.py --cli .venv/bin/tracebench
      - name: Stage only the verified synthetic sample
        run: |
          python -c "from pathlib import Path; import shutil; Path('site').mkdir(); shutil.copyfile('docs/sample-report.html', 'site/index.html')"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the recorded-output synthetic example
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
