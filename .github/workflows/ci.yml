name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test source, real CLI processes, and build artifacts
        run: python -m unittest discover -v
      - name: Install without dependency downloads
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-index .
          .venv/bin/tracebench --version
      - name: Verify installed CLI outside the source directory
        run: .venv/bin/python scripts/verify_demo.py --cli .venv/bin/tracebench
      - name: Verify HTML CLI and exact synthetic sample bytes
        run: .venv/bin/python scripts/verify_html.py --cli .venv/bin/tracebench
