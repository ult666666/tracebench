[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "tracebench"
version = "0.1.0"
description = "Deterministic offline evaluation of recorded AI outputs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []
keywords = ["evaluation", "ai", "offline", "regression", "jsonl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
tracebench = "tracebench.cli:main"
